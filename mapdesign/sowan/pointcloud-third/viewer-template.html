<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お台場 1/3・地形確認</title><style>*{box-sizing:border-box}body{margin:0;background:#15252d;color:#e8f2f5;font:14px/1.6 system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}#panel{position:absolute;top:16px;left:16px;max-width:430px;padding:16px 18px;background:#10222de8;border:1px solid #587783;border-radius:7px}h1{font-size:18px;margin:0 0 8px}p{margin:8px 0}button{background:#304956;color:#e9f3f6;border:1px solid #64818e;border-radius:4px;font:inherit;padding:5px 9px;cursor:pointer}label{margin-right:10px}#credit{position:absolute;bottom:12px;left:16px;right:16px;background:#10222de8;font-size:12px;padding:7px 12px;border-radius:5px}a{color:#8ecfe6}small{color:#b3cad4}#badge{position:absolute;top:18px;right:18px;padding:8px 12px;background:#10222de8;border-radius:5px}</style>
<canvas id="view"></canvas><div id="panel"><h1>お台場 1/3・地形確認</h1><div><button data-view="all">全体</button> <button data-view="top">真上</button> <button data-view="conference">会議棟</button> <button data-view="gate">門状のビル</button> <button data-view="science">科学館</button></div><p><label><input id="edges" type="checkbox">稜線</label><label><input id="boundary" type="checkbox" checked>取得範囲</label><label><input id="helper" type="checkbox" checked>高さ見本</label></p><div id="stats"></div><p><small>左ドラッグ：回転 ／ 右ドラッグ：移動<br>ホイール：拡大縮小。元地図の実寸1/3。<br>地形確認版。基地・プラント・カタパルトは未配置。</small></p><small id="reference"></small></div><div id="badge">地形データ <span id="bytes"></span> ／ 500KB以内</div><div id="credit">出典：東京都デジタルツイン区部点群2024、地理院地図、Project PLATEAU。CC BY 4.0等に基づき加工。整備・公開に携わった皆さまに感謝します。点群で欠ける特徴建物の下面は写真を参照した独自補完。three.js r128（MIT）。</div>
<script>/*THREE_LIBRARY*/</script><script type="application/json" id="terrain">/*TERRAIN_JSON*/</script><script type="application/json" id="mech">/*MECH_JSON*/</script><script>
'use strict';const raw=document.getElementById('terrain').textContent,data=JSON.parse(raw),scene=new THREE.Scene();scene.background=new THREE.Color('#263c47').convertSRGBToLinear();
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,10000),target=new THREE.Vector3();let radius=1900,az=-.18,polar=.83;
scene.add(new THREE.HemisphereLight(0xe5f3ff,0x526858,.55));const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(-300,600,300);scene.add(sun);
const material=c=>new THREE.MeshLambertMaterial({color:new THREE.Color(c).convertSRGBToLinear(),side:THREE.DoubleSide});
const mats=data.palette.map(material),floorMats={land:material('#858d81'),water:material('#39728b'),roads:material('#49565b'),grass:material('#68885c')};
function typed(s,C=Int16Array){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new C(a.buffer);}
function decodeRing(s){const a=typed(s),r=[];for(let i=0;i<a.length;i+=2)r.push(new THREE.Vector2(a[i]*data.coordinateStep,a[i+1]*data.coordinateStep));return r;}
function planar(rings,height){const rs=rings.map(decodeRing),flat=rs.flat(),ids=THREE.ShapeUtils.triangulateShape(rs[0],rs.slice(1)),out=[];for(const f of ids)for(const i of f)out.push(flat[i].x,height,flat[i].y);return out;}
function geometry(arr){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));g.computeVertexNormals();return g;}
const edgeRoot=new THREE.Group();scene.add(edgeRoot);
for(const [name,y]of [['water',-.9],['land',0],['roads',.025],['grass',.04]]){const arr=[];for(const rings of data[name])arr.push(...planar(rings,y));const obj=new THREE.Mesh(geometry(arr),floorMats[name]);scene.add(obj);}
const pools=new Map();function pool(key,arr){let p=pools.get(key);if(!p){p=[];pools.set(key,p);}for(const x of arr)p.push(x);}
for(const [lo,hi,ring,paint,kind] of data.volumes){const r=decodeRing(ring),s=new THREE.Shape(r),g=new THREE.ExtrudeGeometry(s,{depth:hi-lo,bevelEnabled:false,steps:1}),a=g.attributes.position.array;
 for(const group of g.groups){const out=[];for(let i=group.start;i<group.start+group.count;i+=3)for(const vi of [i,i+2,i+1])out.push(a[vi*3],a[vi*3+2]+lo,a[vi*3+1]);pool(paint+':'+group.materialIndex,out);}g.dispose();
}
for(const [key,arr]of pools){const [paint,wall]=key.split(':').map(Number),color=new THREE.Color(data.palette[paint]).convertSRGBToLinear();if(wall)color.multiplyScalar(.86);const g=geometry(arr),obj=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide}));scene.add(obj);edgeRoot.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,25),new THREE.LineBasicMaterial({color:0x304149,transparent:true,opacity:.22})));}
for(const [paint,p64,i64,name]of data.meshes){const p=typed(p64),idx=typed(i64,Uint16Array),a=[];for(const i of idx)a.push(p[i*3]*data.coordinateStep,p[i*3+1]*data.coordinateStep,p[i*3+2]*data.coordinateStep);const g=geometry(a),obj=new THREE.Mesh(g,mats[paint]);obj.name=name;scene.add(obj);edgeRoot.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,25),new THREE.LineBasicMaterial({color:0x344750,transparent:true,opacity:.28})));}
const boundsRoot=new THREE.Group();scene.add(boundsRoot);for(const rings of data.boundary){const r=decodeRing(rings[0]),v=r.map(p=>new THREE.Vector3(p.x,.22,p.y));v.push(v[0].clone());boundsRoot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(v),new THREE.LineBasicMaterial({color:0x77e8ed,transparent:true,opacity:.75})));}
edgeRoot.visible=false;document.getElementById('edges').onchange=e=>{edgeRoot.visible=e.target.checked;render();};document.getElementById('boundary').onchange=e=>{boundsRoot.visible=e.target.checked;render();};
const helper=new THREE.Group();scene.add(helper);const yellow=material('#ffc04d');const pole=new THREE.Mesh(new THREE.BoxGeometry(.16,8,.16),yellow);pole.position.y=4;helper.add(pole);for(let i=0;i<=8;i++){const o=new THREE.Mesh(new THREE.BoxGeometry(i%4===0?1.4:.6,.07,.08),yellow);o.position.y=i;helper.add(o);}
function label(text){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#14252c';ctx.fillRect(0,0,512,96);ctx.fillStyle='#ffd77b';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,65);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(12,2.25,1);return s;}
const caption=label('8m 高さ見本');caption.position.y=10;helper.add(caption);
const mechData=JSON.parse(document.getElementById('mech').textContent),mechRoot=new THREE.Group();helper.add(mechRoot);mechRoot.position.x=4;
for(const p of mechData.parts||[]){const a=p.positions.slice();for(let i=1;i<a.length;i+=3)a[i]-=mechData.minY;mechRoot.add(new THREE.Mesh(geometry(a),material('#'+p.color)));}
document.getElementById('reference').textContent=`黄色：高さ8mの見本 ／ 機体：現行モデル約${mechData.height?.toFixed(1)||'4'}m。`;
document.getElementById('helper').onchange=e=>{helper.visible=e.target.checked;render();};
function render(){camera.position.set(target.x+radius*Math.sin(polar)*Math.sin(az),target.y+radius*Math.cos(polar),target.z+radius*Math.sin(polar)*Math.cos(az));camera.lookAt(target);renderer.render(scene,camera);}
function view(id){if(id==='all'||id==='top'){target.set(0,0,0);radius=1450;polar=id==='top'?.025:.83;az=id==='top'?0:-.18;helper.position.set(data.views.conference.at[0]-28,0,data.views.conference.at[1]+25);}else{const v=data.views[id];target.set(v.at[0],8,v.at[1]);radius=v.range;polar=id==='conference'?1.22:1.08;az=id==='gate'?-1.2:-.7;helper.position.set(v.at[0]-28,0,v.at[1]+25);}render();}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);
const canvas=renderer.domElement;let pointer;canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{pointer={x:e.clientX,y:e.clientY,button:e.button};canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>pointer=null;canvas.onpointermove=e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.x=e.clientX;pointer.y=e.clientY;if(pointer.button===2){target.addScaledVector(new THREE.Vector3(Math.cos(az),0,-Math.sin(az)),-dx*radius/innerHeight*.65);target.addScaledVector(new THREE.Vector3(-Math.sin(az),0,-Math.cos(az)),-dy*radius/innerHeight*.65);}else{az-=dx*.005;polar=Math.max(.025,Math.min(1.55,polar+dy*.005));}render();};canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(12,Math.min(5000,radius*Math.exp(e.deltaY*.001)));render();},{passive:false});function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();render();}addEventListener('resize',resize);
document.getElementById('stats').textContent=`約1,330×620m ／ 39区画 ／ 1/3縮尺。建物・高架など${data.volumes.length}個の単純形状。`;
document.getElementById('bytes').textContent=(new TextEncoder().encode(raw).length/1000).toFixed(1)+'KB';view('all');resize();window.review={data,scene,camera,renderer,view,helper,mechData};window.reviewReady=true;
</script></html>
