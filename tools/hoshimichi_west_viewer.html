<!doctype html>
<html lang="ja"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星路西街区・半縮尺地形案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#27353b;color:#e6eef0;font:14px system-ui,sans-serif;overflow:hidden}canvas{display:block}header{position:absolute;left:20px;top:18px;padding:14px 18px;background:#18242bed;border:1px solid #58707a;border-radius:10px;max-width:calc(100vw - 40px)}h1{margin:0 0 5px;font-size:21px;font-weight:650}p{margin:0;color:#b9ccd2}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;background:#334b57;color:#fff;border:1px solid #76909b;padding:6px 12px;border-radius:5px;cursor:pointer}label{display:inline-flex;align-items:center;gap:4px}#status{position:absolute;right:20px;bottom:74px;padding:10px 14px;border-radius:7px;background:#18242be8;line-height:1.8}footer{position:absolute;left:20px;right:20px;bottom:14px;padding:9px 12px;background:#18242be8;border-radius:6px;font-size:12px;color:#bacece}a{color:#a9dbe9}.legend{display:flex;gap:16px;margin-top:10px;font-size:13px}.yellow{color:#f5d15b}.cyan{color:#77d9ed}.gray{color:#9caeb5}.label{position:absolute;pointer-events:none;background:#16222bdd;border:1px solid #6c838b;padding:4px 8px;border-radius:4px;font-size:13px;transform:translate(-50%,-100%);white-space:nowrap}#error{position:absolute;inset:40%;white-space:pre-wrap;background:#6c2626}
</style>
<header><h1>星路西街区・半縮尺地形案</h1><p>秋葉原から西へ延長 · 進軍方向に長い街区 · 北が上</p>
<nav><button id="top">俯瞰</button><button id="oblique">斜め</button><button id="akiba">秋葉原側</button><button id="west">西側</button><select id="deform"><option value="0">地理配置のまま</option><option value="1">東西の通りを曲げる案</option></select><label><input id="labels" type="checkbox" checked>地点名</label><label><input id="frame" type="checkbox" checked>範囲枠</label></nav>
<div class="legend"><span class="yellow">━ 進入範囲案</span><span class="cyan">┄ 現行600m四方</span><span class="gray">外側：簡略背景</span></div></header>
<div id="status">読み込み中</div><footer>地形確認用・基地/プラント未配置。左ドラッグで回転、右ドラッグで移動、ホイールで拡大。<br>出典：東京都・千代田区・台東区・文京区／国土交通省 Project PLATEAU、国土地理院。CC BY 4.0。取得地形を平坦化・縮小・単純化し、鉄道を模式的に延長。公開データを整備された皆さまに感謝します。</footer>

<script>/*__THREE__*/</script><script>/*__EXPAND__*/</script><script>
'use strict';
(async()=>{try{
const encoded=/*__PAYLOAD__*/;
const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
const layout=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const rawBytes=new TextEncoder().encode(JSON.stringify(layout)).length;
if(layout.volumeEncoding==='kind-u8-color-u8-y01-i16-rings-u16'){
 const a=Uint8Array.from(atob(layout.volumes),c=>c.charCodeAt(0)),v=new DataView(a.buffer),out=[];let offset=0;
 const take=n=>{if(offset+n>a.length)throw Error('建物の整数列が途中で切れています');const start=offset;offset+=n;return start;};
 while(offset<a.length){const h=take(8),kind=v.getUint8(h),color=layout.volumeColors[v.getUint8(h+1)],bottom=v.getInt16(h+2,true)/100,top=v.getInt16(h+4,true)/100,n=v.getUint16(h+6,true),rings=[];
  if(kind>=layout.volumeKinds.length||!n||top<=bottom)throw Error('建物の寸法か種類が不正です');
  for(let i=0;i<n;i++){const count=v.getUint16(take(2),true),p=take(count*4);if(count<3)throw Error('建物の頂点不足');rings.push(btoa(String.fromCharCode(...a.subarray(p,p+count*4))));}
  out.push([kind,bottom,top,rings,color?{landmarkColor:color}:{}]);
 }
 if(out.length!==layout.volumeCount)throw Error('建物の件数が一致しません');layout.volumes=out;
}
const meta=layout.preview;expandCityLayout(THREE,layout);
const scene=new THREE.Scene();scene.background=new THREE.Color('#26373f');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f3ff,0x667571,1.0));const sun=new THREE.DirectionalLight(0xfff7e7,.8);sun.position.set(-300,900,250);scene.add(sun);
const camera=new THREE.OrthographicCamera(-600,600,400,-400,.1,10000),target=new THREE.Vector3();
const meshes=[],frames=new THREE.Group();scene.add(frames);
const colors={dem:'#5b6966',water:'#337c9c',bed:'#324c56',tran:'#8ba0a6'};
// 長い板も建物と同じ曲線へ沿わせる。保存データは増やさず、描画時だけ東西方向へ分割する。
function subdivideX(points){const result=[],stack=[];for(let i=0;i<points.length;i+=9)stack.push([Array.from(points.subarray(i,i+3)),Array.from(points.subarray(i+3,i+6)),Array.from(points.subarray(i+6,i+9))]);
 while(stack.length){const t=stack.pop(),edges=[[0,1,2],[1,2,0],[2,0,1]];let edge=edges[0];for(const e of edges)if(Math.abs(t[e[0]][0]-t[e[1]][0])>Math.abs(t[edge[0]][0]-t[edge[1]][0]))edge=e;
  const [i,j,k]=edge;if(Math.abs(t[i][0]-t[j][0])<=8){for(const p of t)result.push(...p);continue;}const m=t[i].map((n,axis)=>(n+t[j][axis])/2);stack.push([t[i],m,t[k]],[m,t[j],t[k]]);
 }return new Float32Array(result);}
for(const [name,base64] of Object.entries(layout.meshes)){
 const b=Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),sourcePoints=new Float32Array(b.buffer);if(!sourcePoints.length)continue;
 const ranges=layout.colors?.[name];let points,attributes=null;
 if(ranges){
  // 色の範囲ごとに分割し、建物の位置と色の対応を維持する。
  const pieces=ranges.map(q=>({q,a:subdivideX(sourcePoints.subarray(q.start*3,(q.start+q.count)*3))}));
  const count=pieces.reduce((n,p)=>n+p.a.length,0);points=new Float32Array(count);attributes=new Float32Array(count);let at=0;
  for(const {q,a} of pieces){points.set(a,at);const c=new THREE.Color(q.color).convertSRGBToLinear();for(let i=0;i<a.length;i+=3)c.toArray(attributes,at+i);at+=a.length;}
 }else points=subdivideX(sourcePoints);
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(points,3));geometry.computeVertexNormals();
 if(attributes)geometry.setAttribute('color',new THREE.BufferAttribute(attributes,3));
 const mat=new THREE.MeshStandardMaterial({color:ranges?0xffffff:new THREE.Color(colors[name]||'#bac6c6').convertSRGBToLinear(),vertexColors:!!ranges,roughness:1,side:THREE.DoubleSide});
 const mesh=new THREE.Mesh(geometry,mat);mesh.userData.original=points.slice();scene.add(mesh);meshes.push(mesh);
}
function outline(points,color,dashed){const a=[];for(let i=0;i<points.length;i++){const p=points[i],q=points[(i+1)%points.length],n=Math.max(1,Math.ceil(Math.abs(q[0]-p[0])/8));for(let j=0;j<n;j++)a.push(new THREE.Vector3(p[0]+(q[0]-p[0])*j/n,1,p[1]+(q[1]-p[1])*j/n));}a.push(a[0].clone());const geometry=new THREE.BufferGeometry().setFromPoints(a);const m=new THREE.Line(geometry,dashed?new THREE.LineDashedMaterial({color,dashSize:5,gapSize:4,depthTest:false}):new THREE.LineBasicMaterial({color,depthTest:false}));m.userData.original=geometry.attributes.position.array.slice();m.renderOrder=20;m.computeLineDistances();frames.add(m);return m;}
outline(meta.playable,0xf4d35f,false);outline(meta.previous,0x76d6e8,true);
const labels=meta.labels.map(q=>{const el=document.createElement('div');el.className='label';el.textContent=q.text;document.body.append(el);return{...q,el};});
let warped=false,yaw=0,pitch=Math.PI/2-.000001,span=700,presetName='top';
const bend=x=>warped?meta.warp.amplitude*Math.sin(x*2*Math.PI/meta.warp.wavelength):0;
function render(){
 const aspect=innerWidth/innerHeight;camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.updateProjectionMatrix();
 camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(1600));camera.up.set(0,1,0);camera.lookAt(target);camera.updateMatrixWorld(true);renderer.render(scene,camera);
 for(const q of labels){const p=new THREE.Vector3(q.at[0],38,q.at[1]+bend(q.at[0])).project(camera);q.el.style.left=(p.x+1)*innerWidth/2+'px';q.el.style.top=(1-p.y)*innerHeight/2+'px';q.el.hidden=!document.getElementById('labels').checked||Math.abs(p.x)>1||Math.abs(p.y)>1;}
 document.getElementById('status').innerHTML='戦場候補 '+meta.playableExtent.join(' × ')+' m<br>背景込み '+meta.drawingExtent.join(' × ')+' m<br>縮尺 1/2 · 機体8m級相当<br>地形データ '+(rawBytes/1000).toFixed(1)+' KB';
}
function preset(name){presetName=name;const aspect=innerWidth/innerHeight;
 if(name==='top'){yaw=0;pitch=Math.PI/2-.000001;target.set(0,0,-25);span=Math.max(meta.drawingExtent[1]*1.3,meta.drawingExtent[0]/aspect*1.12);}
 if(name==='oblique'){yaw=.12;pitch=.85;target.set(0,12,0);span=650;}
 if(name==='akiba'){yaw=0;pitch=.95;target.set(155,12,0);span=420;}
 if(name==='west'){yaw=0;pitch=.95;target.set(-240,12,-20);span=420;}
 render();
}
function deform(){for(const m of [...meshes,...frames.children]){const a=m.geometry.attributes.position,original=m.userData.original;for(let i=0;i<a.count;i++)a.setXYZ(i,original[i*3],original[i*3+1],original[i*3+2]+bend(original[i*3]));a.needsUpdate=true;if(m.isMesh)m.geometry.computeVertexNormals();m.geometry.computeBoundingSphere();if(m.isLine)m.computeLineDistances();}render();}
for(const name of ['top','oblique','akiba','west'])document.getElementById(name).onclick=()=>preset(name);
document.getElementById('deform').onchange=e=>{warped=e.target.value==='1';deform();};document.getElementById('labels').onchange=render;document.getElementById('frame').onchange=e=>{frames.visible=e.target.checked;render();};
let drag=null;renderer.domElement.oncontextmenu=e=>e.preventDefault();renderer.domElement.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,button:e.button};renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointerup=()=>drag=null;renderer.domElement.onpointercancel=()=>drag=null;
renderer.domElement.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.button===2||e.shiftKey){target.x-=dx*span/innerHeight;target.z-=dy*span/innerHeight;}else{yaw-=dx*.006;pitch=Math.max(.15,Math.min(Math.PI/2-.000001,pitch+dy*.006));}render();};
renderer.domElement.onwheel=e=>{e.preventDefault();span=Math.max(50,Math.min(1500,span*Math.exp(e.deltaY*.001)));render();};addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);render();});
window.__preview={layout,meta,scene,renderer,camera,preset,deform,setWarp(value){warped=value;document.getElementById('deform').value=value?'1':'0';deform();},get warped(){return warped;}};
preset('top');document.body.dataset.ready='true';
}catch(e){const el=document.createElement('pre');el.id='error';el.textContent=e.stack;document.body.append(el);console.error(e);}})();
</script></html>
